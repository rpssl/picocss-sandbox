<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Šolski Oglasnik - Dodaj oglas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>🏫 Šolski Oglasnik</strong></li></ul>
      <ul>
        <li><a href="index.html">Oglasi</a></li>
        <li><a href="dodaj.html" role="button">Dodaj oglas</a></li>
      </ul>
    </nav>

    <h2>Objavi nov oglas</h2>
    <p>Izpolni spodnje podatke (vsa polja z zvezdico so obvezna).</p>

    <!-- OBRAZEC SE MORA UJEMATI S TABELO 'oglasi' v bazi -->
    <form action="index.html">
      <label for="naslov">Naslov oglasa *</label>
      <input type="text" id="naslov" name="naslov" placeholder="Npr. Zbirka nalog za fiziko" required>

      <div class="grid">
        <fieldset>
          <label for="kategorija">Kategorija *</label>
          <select id="kategorija" name="kategorija_id" required>
            <option value="" selected disabled>Izberi iz seznama...</option>
            <option value="1">Šolska oprema in pribor</option>
            <option value="2">Učbeniki in literatura</option>
          </select>
        </fieldset>

        <fieldset>
          <label for="cena">Cena (€) *</label>
          <input type="number" id="cena" name="cena" step="0.01" min="0" placeholder="0.00" required>
        </fieldset>
      </div>

      <label for="opis">Opis oglasa *</label>
      <textarea id="opis" name="opis" placeholder="Opiši predmet, ohranjenost in kje ga je mogoče prevzeti..." required></textarea>

      <div class="grid">
        <button type="submit">Shrani oglas</button>
        <a href="index.html" role="button" class="secondary outline">Prekliči</a>
      </div>
    </form>
  </main>
</body>
</html>
